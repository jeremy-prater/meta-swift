name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  yocto-aarch64:
    runs-on: ubuntu-24.04
    container:
    steps:
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt install -y build-essential chrpath cpio debianutils diffstat file gawk gcc git iputils-ping libacl1 liblz4-tool locales python3 python3-git python3-jinja2 python3-pexpect python3-pip python3-subunit socat texinfo unzip wget xz-utils zstd qemu-user
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Checkout Poky
        uses: actions/checkout@v4
        with:
          repository: yoctoproject/poky
          path: poky
          ref: scarthgap
      - name: Checkout Swift layer
        uses: actions/checkout@v4
        with:
          path: poky/meta-swift
      - name: Build
        run: |
          cd $GITHUB_WORKSPACE/poky
          source oe-init-build-env
          bitbake-layers add-layer ../meta-swift
          rm -f conf/local.conf
          cat > conf/local.conf <<'EOF'
          MACHINE = "qemuarm64"
          PREFERRED_PROVIDER_virtual/swift-native = "swift-binary-native"
          EOF
          bitbake swift-hello-world
          WORKDIR=$(bitbake -e swift-hello-world | grep '^WORKDIR=' | cut -d'"' -f2)
          qemu-arm64 -L $WORKDIR/recipe-sysroot $WORKDIR/build/release/hello-world
          qemu-arm64 -L $WORKDIR/recipe-sysroot $WORKDIR/build/release/hello-worldPackageTests.xctest --testing-library swift-testing

