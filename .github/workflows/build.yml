name: build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      is_self_hosted:
        type: boolean
        default: false

jobs:
  yocto-aarch64:
    runs-on: ${{ inputs.is_self_hosted && 'self-hosted' || 'ubuntu-24.04' }}
    container:
    steps:
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt install -y build-essential chrpath cpio debianutils diffstat file gawk gcc git iputils-ping libacl1 liblz4-tool locales python3 python3-git python3-jinja2 python3-pexpect python3-pip python3-subunit socat texinfo unzip wget xz-utils zstd qemu-user
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Checkout BitBake
        run: git clone --depth 1 --branch master https://git.openembedded.org/bitbake $GITHUB_WORKSPACE/bitbake
      - name: Checkout OpenEmbedded Core
        run: git clone --depth 1 --branch master https://git.openembedded.org/openembedded-core $GITHUB_WORKSPACE/openembedded-core
      - name: Checkout Swift layer
        uses: actions/checkout@v4
        with:
          path: meta-swift
      - name: Build
        run: |
          cd $GITHUB_WORKSPACE
          source openembedded-core/oe-init-build-env build
          bitbake-layers add-layer ../meta-swift
          rm -f conf/local.conf
          cat > conf/local.conf <<'EOF'
          MACHINE = "qemuarm64"
          DISTRO = "nodistro"
          INIT_MANAGER = "mdev-busybox"
          EOF
          bitbake swift-hello-world
          WORKDIR=$(bitbake -e swift-hello-world | grep '^WORKDIR=' | cut -d'"' -f2)
          export LD_LIBRARY_PATH="$WORKDIR/recipe-sysroot/usr/lib/swift/linux:$WORKDIR/recipe-sysroot/usr/lib:$WORKDIR/recipe-sysroot/lib"
          qemu-arm64 -L $WORKDIR/recipe-sysroot $WORKDIR/build/release/hello-world
          qemu-arm64 -L $WORKDIR/recipe-sysroot $WORKDIR/build/release/hello-worldPackageTests.xctest --testing-library swift-testing

  yocto-armv7:
