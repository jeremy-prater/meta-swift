name: build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      is_self_hosted:
        type: boolean
        default: false

jobs:
  yocto-aarch64:
    runs-on: ${{ inputs.is_self_hosted && 'self-hosted' || 'ubuntu-24.04' }}
    container:
    steps:
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt install -y build-essential chrpath cpio debianutils diffstat file gawk gcc git iputils-ping libacl1 liblz4-tool locales python3 python3-git python3-jinja2 python3-pexpect python3-pip python3-subunit socat texinfo unzip wget xz-utils zstd qemu-user
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Checkout BitBake
        run: git clone --depth 1 --branch 2.18 https://git.openembedded.org/bitbake $GITHUB_WORKSPACE/bitbake
      - name: Checkout OpenEmbedded Core
        run: git clone --depth 1 --branch wrynose https://git.openembedded.org/openembedded-core $GITHUB_WORKSPACE/openembedded-core
      - name: Checkout Swift layer
        uses: actions/checkout@v4
        with:
          path: meta-swift
      - name: Build
        run: |
          cd $GITHUB_WORKSPACE
          source openembedded-core/oe-init-build-env build
          bitbake-layers add-layer ../meta-swift
          rm -f conf/local.conf
          cat > conf/local.conf <<'EOF'
          MACHINE = "qemuarm64"
          DISTRO = "nodistro"
          INIT_MANAGER = "mdev-busybox"
          EOF
          bitbake swift-hello-world
          WORKDIR=$(bitbake -e swift-hello-world | grep '^WORKDIR=' | cut -d'"' -f2)
          export LD_LIBRARY_PATH="$WORKDIR/recipe-sysroot/usr/lib/swift/linux:$WORKDIR/recipe-sysroot/usr/lib:$WORKDIR/recipe-sysroot/lib"
          qemu-arm64 -L $WORKDIR/recipe-sysroot $WORKDIR/build/release/hello-world
          qemu-arm64 -L $WORKDIR/recipe-sysroot $WORKDIR/build/release/hello-world-test-test-runner --testing-library swift-testing

  yocto-armv7:
    runs-on: ${{ inputs.is_self_hosted && 'self-hosted' || 'ubuntu-24.04' }}
    container:
    steps:
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt install -y build-essential chrpath cpio debianutils diffstat file gawk gcc git iputils-ping libacl1 liblz4-tool locales python3 python3-git python3-jinja2 python3-pexpect python3-pip python3-subunit socat texinfo unzip wget xz-utils zstd qemu-user
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Checkout BitBake
        run: git clone --depth 1 --branch 2.18 https://git.openembedded.org/bitbake $GITHUB_WORKSPACE/bitbake
      - name: Checkout OpenEmbedded Core
        run: git clone --depth 1 --branch wrynose https://git.openembedded.org/openembedded-core $GITHUB_WORKSPACE/openembedded-core
      - name: Checkout Swift layer
        uses: actions/checkout@v4
        with:
          path: meta-swift
      - name: Build
        run: |
          cd $GITHUB_WORKSPACE
          source openembedded-core/oe-init-build-env build
          bitbake-layers add-layer ../meta-swift
          rm -f conf/local.conf
          cat > conf/local.conf <<'EOF'
          MACHINE = "qemuarm"
          DISTRO = "nodistro"
          INIT_MANAGER = "mdev-busybox"
          EOF
          bitbake swift-hello-world
          WORKDIR=$(bitbake -e swift-hello-world | grep '^WORKDIR=' | cut -d'"' -f2)
          export LD_LIBRARY_PATH="$WORKDIR/recipe-sysroot/usr/lib/swift/linux:$WORKDIR/recipe-sysroot/usr/lib:$WORKDIR/recipe-sysroot/lib"
          qemu-arm -L $WORKDIR/recipe-sysroot $WORKDIR/build/release/hello-world
          qemu-arm -L $WORKDIR/recipe-sysroot $WORKDIR/build/release/hello-world-test-test-runner --testing-library swift-testing

  yocto-x86_64:
    runs-on: ${{ inputs.is_self_hosted && 'self-hosted' || 'ubuntu-24.04' }}
    container:
    steps:
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt install -y build-essential chrpath cpio debianutils diffstat file gawk gcc git iputils-ping libacl1 liblz4-tool locales python3 python3-git python3-jinja2 python3-pexpect python3-pip python3-subunit socat texinfo unzip wget xz-utils zstd qemu-user
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Checkout BitBake
        run: git clone --depth 1 --branch 2.18 https://git.openembedded.org/bitbake $GITHUB_WORKSPACE/bitbake
      - name: Checkout OpenEmbedded Core
        run: git clone --depth 1 --branch wrynose https://git.openembedded.org/openembedded-core $GITHUB_WORKSPACE/openembedded-core
      - name: Checkout Swift layer
        uses: actions/checkout@v4
        with:
          path: meta-swift
      - name: Build
        run: |
          cd $GITHUB_WORKSPACE
          source openembedded-core/oe-init-build-env build
          bitbake-layers add-layer ../meta-swift
          rm -f conf/local.conf
          cat > conf/local.conf <<'EOF'
          MACHINE = "qemux86-64"
          DISTRO = "nodistro"
          INIT_MANAGER = "mdev-busybox"
          EOF
          bitbake swift-hello-world
          WORKDIR=$(bitbake -e swift-hello-world | grep '^WORKDIR=' | cut -d'"' -f2)
          # qemu-user's -L sysroot does not fully isolate library resolution
          # when the host arch matches the target: the runner's own
          # /lib/x86_64-linux-gnu/libm.so.6 shadows the sysroot's, so
          # libswiftCore.so's GLIBC_2.43 requirement fails and the binary
          # segfaults. Invoke the target ld.so explicitly with --library-path
          # so only the sysroot's libs are considered. Not needed on armv7 or
          # aarch64 where the host has no matching-arch libs to shadow.
          LDSO=$WORKDIR/recipe-sysroot/lib/ld-linux-x86-64.so.2
          LIBS=$WORKDIR/recipe-sysroot/usr/lib/swift/linux:$WORKDIR/recipe-sysroot/usr/lib:$WORKDIR/recipe-sysroot/lib
          qemu-x86_64 -L $WORKDIR/recipe-sysroot $LDSO --library-path $LIBS $WORKDIR/build/release/hello-world
          qemu-x86_64 -L $WORKDIR/recipe-sysroot $LDSO --library-path $LIBS $WORKDIR/build/release/hello-world-test-test-runner --testing-library swift-testing
