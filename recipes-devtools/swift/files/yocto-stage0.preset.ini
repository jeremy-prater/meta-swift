# Stage-0 bootstrap preset: build a Swift compiler using ONLY a C/C++ host
# compiler. Derived from upstream's [preset: bootstrap_stage0] in
# utils/build-presets.ini (self-contained rather than mixin'd, same policy as
# yocto-native.preset.ini -- diff against upstream on SWIFT_VERSION bumps).
#
# The single fact that makes a Swift-free bootstrap possible:
#   -DSWIFT_ENABLE_SWIFT_IN_SWIFT:BOOL=NO
# turns off SwiftCompilerSources / the swift-syntax-based macro plugins, which
# are the only parts of the compiler written in Swift. Everything else in
# stage0 is C++ (LLVM, clang, the swift frontend) or is compiled by the clang
# that stage0 itself just built (stdlib, libdispatch -- see
# build-runtime-with-host-compiler=0, and build-script-impl's CLANG_BIN
# fallback to the in-tree llvm build dir).
#
# Deltas from upstream bootstrap_stage0, all deliberate:
#   - lld added to llvm-install-components + CLANG_DEFAULT_LINKER=lld, so the
#     stage0 clang handed to the stage2 build links with lld. This is what
#     removes PR#59's "find the ld.lld inside clang-native's WORKDIR and
#     symlink it over ld/ld.gold" shim.
#   - LLVM_USE_LINKER=lld so stage0's OWN links use lld-native (ld.bfd runs out
#     of memory linking LLVM at -j).
#   - LLVM_ENABLE_TERMINFO=OFF, matching yocto-native.preset.ini.
#   - llvm-targets-to-build widened to X86;ARM;AArch64 to match the final
#     toolchain (upstream stage0 does AArch64;X86 only).
#   - no build-ninja / build-cmake: ninja-native and cmake-native are in
#     DEPENDS.

[preset: yocto_stage0]

build-subdir=yocto-stage0

release

libdispatch

skip-early-swiftsyntax
skip-early-swift-driver
skip-build-benchmarks
build-swift-examples=0

swift-include-tests=0
llvm-include-tests=0
skip-test-swift
skip-test-cmark
skip-test-libdispatch

build-runtime-with-host-compiler=0
build-swift-libexec=0
build-swift-remote-mirror=0
build-swift-static-sdk-overlay=0
build-swift-static-stdlib=0
enable-experimental-concurrency=1
enable-experimental-distributed=0
enable-experimental-observation=0
enable-experimental-differentiable-programming=0

llvm-targets-to-build=X86;ARM;AArch64

extra-swift-cmake-options=
  -DSWIFT_ENABLE_SWIFT_IN_SWIFT:BOOL=NO
  -DSWIFT_INCLUDE_DOCS:BOOL=NO
  -DSWIFT_BUILD_EXAMPLES:BOOL=OFF

llvm-cmake-options=
  -DCLANG_DEFAULT_LINKER=lld
  -DLLVM_ENABLE_TERMINFO=OFF
  -DLLVM_USE_LINKER=lld

install-prefix=/usr
install-destdir=%(install_destdir)s

swift-install-components=autolink-driver;compiler;clang-resource-dir-symlink;stdlib;sdk-overlay;toolchain-tools
llvm-install-components=llvm-ar;llvm-nm;llvm-ranlib;clang;clang-resource-headers;builtins;runtimes;clang-features-file;llvm-symbolizer;lld

install-llvm
install-swift
install-libdispatch

relocate-xdg-cache-home-under-build-subdir
