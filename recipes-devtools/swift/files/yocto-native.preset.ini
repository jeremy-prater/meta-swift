# Self-contained Yocto build preset for Swift's utils/build-script. Closer
# in shape to buildbot_linux_armv7 than to buildbot_linux: native toolchain
# only, no lldb/sourcekit-lsp/indexstore-db/wasm/embedded-cross, no
# swift-format/swift-docc (their local-deps workspace drags in swift-nio /
# swift-lmdb). xctest + swift-testing + swift-testing-macros ARE built --
# swift-bootstrap compiles swiftpm's _InternalTestSupport which imports
# XCTest and Testing, and the latter requires the TestingMacros plugin.
#
# On SWIFT_VERSION bumps, diff against upstream's build-presets.ini for the
# target branch and port deltas deliberately.

[preset: yocto_native]

build-subdir=yocto

release
assertions
no-swift-stdlib-assertions
swift-enable-ast-verifier=0

bootstrapping=hosttools
llvm-targets-to-build=X86;ARM;AArch64

# Do not build the "early" swift-driver. It is compiled with the BOOTSTRAP
# toolchain before anything in-tree exists, and llbuild's Swift bindings
# import Foundation -- which a source-built stage-0 bootstrap does not have (it
# builds stdlib + libdispatch only). Upstream sets this in both
# bootstrap_stage1 and bootstrap_stage2 for exactly this reason; the swift.org
# tarball happens to carry Foundation, which is why the tarball-bootstrapped
# path got away without it. swift-driver proper is still built and installed
# later, against the Foundation this build produces itself.
skip-early-swift-driver

skip-test-swift
skip-test-cmark
skip-test-llbuild
skip-test-swiftpm
skip-test-xctest
skip-test-foundation
skip-test-libdispatch
skip-build-benchmarks

foundation
libdispatch
xctest
swift-testing
swift-testing-macros
llbuild
swiftpm
swift-driver

build-ninja
build-swift-static-stdlib
build-swift-static-sdk-overlay

install-prefix=/usr
install-destdir=%(install_destdir)s

install-llvm
install-static-linux-config
install-swift
install-llbuild
install-swiftpm
install-swift-driver
install-swiftsyntax
install-foundation
install-libdispatch
install-xctest
install-swift-testing
install-swift-testing-macros

swift-install-components=autolink-driver;compiler;clang-resource-dir-symlink;libexec;stdlib;swift-remote-mirror;sdk-overlay;static-mirror-lib;toolchain-tools;license;sourcekit-inproc

llvm-install-components=llvm-ar;llvm-nm;llvm-ranlib;llvm-cov;llvm-profdata;llvm-objdump;llvm-objcopy;llvm-symbolizer;IndexStore;clang;clang-resource-headers;builtins;runtimes;clangd;libclang;lld;LTO;clang-features-file

# Force lld everywhere, for two independent reasons.
#
# 1. gold's response-file parser splits on whitespace, and swift-collections
#    1.1.6 ships files with spaces in their names ("OrderedSet+Partial
#    SetAlgebra subtracting.swift").
# 2. swift/CMakeLists.txt defaults SWIFT_USE_LINKER to gold whenever it finds
#    ld.gold >= 2.36 (only Amazon Linux 2023 and a few others default to lld),
#    while LLVM adds the lld-only -Wl,--color-diagnostics to the shared link
#    flags. gold then chokes on it:
#        /usr/bin/ld.gold: --color-diagnostics: unknown option
#    Setting SWIFT_USE_LINKER explicitly makes both bootstraps behave the same
#    instead of depending on how the host compiler happened to be configured.
#
# LLVM_USE_LINKER is what pure-Swift host tools actually read: AddPureSwift.cmake
# emits "-use-ld=${LLVM_USE_LINKER}" and ignores SWIFT_USE_LINKER entirely. Drop
# it and tools like swift-function-caller-generator fall back to the bootstrap
# clang's default linker, which is how the stage-0-bootstrapped build broke.
#
# But setting it alone breaks the OTHER bootstrap: it puts the lld-only
# -Wl,--color-diagnostics into flags inherited by libdispatch, which swift
# builds as an ExternalProject, and libdispatch would otherwise link with the
# bootstrap clang's default -- lld for a stage-0 bootstrap, but /usr/bin/ld.gold
# for the swift.org tarball, which then chokes:
#     /usr/bin/ld.gold: --color-diagnostics: unknown option
#
# So pin the linker for libdispatch too. Libdispatch.cmake forwards
# CMAKE_EXE_LINKER_FLAGS and CMAKE_SHARED_LINKER_FLAGS from the swift build into
# the ExternalProject, so setting them here reaches it. Both bootstraps ship
# ld.lld (verified in the swift.org tarball and in yocto-stage0's install
# components), so neither depends on its clang's default any more -- which was
# the actual defect behind three separate linker failures.

extra-swift-cmake-options=
    -DSWIFT_USE_LINKER=lld
    -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld
    -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld

llvm-cmake-options=
    -DCROSS_TOOLCHAIN_FLAGS_LLVM_NATIVE='-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++'
    -DCLANG_DEFAULT_LINKER=lld
    -DLLVM_USE_LINKER=lld
    -DLLVM_ENABLE_TERMINFO=OFF

relocate-xdg-cache-home-under-build-subdir
