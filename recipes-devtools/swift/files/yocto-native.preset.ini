# Self-contained Yocto build preset for Swift's utils/build-script. Closer
# in shape to buildbot_linux_armv7 than to buildbot_linux: native toolchain
# only, no lldb/sourcekit-lsp/indexstore-db/wasm/embedded-cross, no
# swift-format/swift-docc (their local-deps workspace drags in swift-nio /
# swift-lmdb). xctest + swift-testing + swift-testing-macros ARE built --
# swift-bootstrap compiles swiftpm's _InternalTestSupport which imports
# XCTest and Testing, and the latter requires the TestingMacros plugin.
#
# On SWIFT_VERSION bumps, diff against upstream's build-presets.ini for the
# target branch and port deltas deliberately.

[preset: yocto_native]

build-subdir=yocto

release
assertions
no-swift-stdlib-assertions
swift-enable-ast-verifier=0

bootstrapping=hosttools
llvm-targets-to-build=X86;ARM;AArch64

skip-test-swift
skip-test-cmark
skip-test-llbuild
skip-test-swiftpm
skip-test-xctest
skip-test-foundation
skip-test-libdispatch
skip-build-benchmarks

foundation
libdispatch
xctest
swift-testing
swift-testing-macros
llbuild
swiftpm
swift-driver

build-ninja
build-swift-static-stdlib
build-swift-static-sdk-overlay

install-prefix=/usr
install-destdir=%(install_destdir)s

install-llvm
install-static-linux-config
install-swift
install-llbuild
install-swiftpm
install-swift-driver
install-swiftsyntax
install-foundation
install-libdispatch
install-xctest
install-swift-testing
install-swift-testing-macros

swift-install-components=autolink-driver;compiler;clang-resource-dir-symlink;libexec;stdlib;swift-remote-mirror;sdk-overlay;static-mirror-lib;toolchain-tools;license;sourcekit-inproc

llvm-install-components=llvm-ar;llvm-nm;llvm-ranlib;llvm-cov;llvm-profdata;llvm-objdump;llvm-objcopy;llvm-symbolizer;IndexStore;clang;clang-resource-headers;builtins;runtimes;clangd;libclang;lld;LTO;clang-features-file

llvm-cmake-options=
    -DCROSS_TOOLCHAIN_FLAGS_LLVM_NATIVE='-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++'
    -DCLANG_DEFAULT_LINKER=lld
    -DLLVM_ENABLE_TERMINFO=OFF

relocate-xdg-cache-home-under-build-subdir
