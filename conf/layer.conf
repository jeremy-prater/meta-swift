# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb \
            ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "swift-layer"
BBFILE_PATTERN_swift-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_swift-layer = "7"

LAYERSERIES_COMPAT_swift-layer = "styhead wrynose"

# Tarball default; the source-built provider (swift-native) takes hours on
# cold sstate. Flip to it via local.conf / distro conf:
#   PREFERRED_PROVIDER_virtual/swift-native = "swift-native"
PREFERRED_PROVIDER_virtual/swift-native ?= "swift-binary-native"

# The toolchain swift-native bootstraps FROM. Default is the swift.org tarball;
# swift-stage0-native builds that bootstrap compiler from source too, so that
# no prebuilt Swift binary appears anywhere in the dependency graph:
#   PREFERRED_PROVIDER_virtual/swift-bootstrap-native = "swift-stage0-native"
# Only consulted when virtual/swift-native resolves to swift-native.
PREFERRED_PROVIDER_virtual/swift-bootstrap-native ?= "swift-bootstrap-native"
